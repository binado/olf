[package]
name = "olf"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "CLI for managing and building local Overleaf projects with coding agents"
license = "MIT"
repository = "https://github.com/binado/olf"
readme = "README.md"
keywords = ["overleaf", "latex", "cli", "agents"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/tests/**",
    "/skills/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
open = "5.4.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.6"
toml_edit = "0.25.15"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
